name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push cancels its older run, so a branch with several pushes in a
# row does not queue several full runs — and does not notify on each of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No `version:` on purpose. pnpm/action-setup fails hard when both it and
      # package.json's `packageManager` pin a version, and package.json is the
      # one that also pins the local dev environment — so let it win.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Playwright's chromium, for the drag-and-drop check.
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # browser-check speaks CDP to a Chrome; pin it to the Playwright
      # chromium installed above. Relying on the runner's google-chrome broke
      # when that Chrome stopped exposing remote debugging on the shared
      # profile ("chrome did not expose a debugging endpoint").
      - name: Browser checks (layout, docs, i18n, drag & drop)
        run: |
          CHROME_PATH=$(cd packages/web && node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          export CHROME_PATH
          pnpm --filter @wayblink/using-kanban-web browser-check
          pnpm --filter @wayblink/using-kanban-web drag-check
