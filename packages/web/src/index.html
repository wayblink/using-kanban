<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>using-kanban</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Crect x='6' y='7' width='5' height='18' rx='1.5' fill='white' opacity='.95'/%3E%3Crect x='13.5' y='7' width='5' height='12' rx='1.5' fill='white' opacity='.75'/%3E%3Crect x='21' y='7' width='5' height='16' rx='1.5' fill='white' opacity='.55'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <a class="brand" href="#/docs">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">using-kanban</span>
        </a>
      </div>

      <nav class="nav" aria-label="views">
        <a href="#/docs" class="nav-link" data-route="docs">Docs</a>
        <a href="#/board" class="nav-link" data-route="board">Board</a>
      </nav>

      <div class="topbar-right">
        <span class="version" title="using-kanban version">v0.1</span>
        <div class="lang-switch" role="group" aria-label="language">
          <button type="button" class="lang-option" data-lang="en">EN</button>
          <button type="button" class="lang-option" data-lang="zh">中文</button>
        </div>
      </div>
    </header>

    <div id="board-controls" class="board-controls" hidden>
      <div class="identity" title="Who this browser acts as on the board">
        <label for="actor-name">acting as</label>
        <input
          id="actor-name"
          type="text"
          autocomplete="off"
          spellcheck="false"
        />
        <select id="actor-type" aria-label="actor type">
          <option value="human">human</option>
          <option value="agent">agent</option>
        </select>
      </div>

      <div class="filters" id="filters">
        <input
          id="filter-q"
          type="search"
          placeholder="Filter title / body…"
          autocomplete="off"
        />
        <select id="filter-assignee" aria-label="filter by assignee"></select>
        <select id="filter-reviewer" aria-label="filter by reviewer"></select>
      </div>

      <span id="live" class="live" data-state="connecting">connecting…</span>
      <button id="new-card" class="primary" type="button">+ New card</button>
    </div>

    <main id="board" class="board" aria-label="kanban board" hidden></main>
    <main id="docs" class="docs" aria-label="documentation" hidden></main>

    <div id="drawer-backdrop" class="backdrop" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-label="card detail"></aside>

    <div id="modal-backdrop" class="backdrop" hidden></div>
    <div
      id="modal"
      class="modal"
      hidden
      role="dialog"
      aria-label="new card"
    ></div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
